<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>📝 CallsViewer - Register</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Helvetica',sans-serif; }
    body { background:#2c3e50; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .container { text-align:center; width:380px; }
    .logo { font-size:48px; }
    h1 { color:white; margin:8px 0; }
    .sub { color:#95a5a6; margin-bottom:25px; }
    .card { background:white; border-radius:8px; padding:30px; text-align:left; }
    .card h2 { color:#2c3e50; margin-bottom:18px; }
    label { display:block; color:#7f8c8d; font-size:13px; margin-bottom:4px; }
    input { width:100%; padding:10px; border:1px solid #ccc; border-radius:4px; margin-bottom:14px; font-size:14px; }
    .btn { width:100%; padding:12px; border:none; border-radius:4px; color:white; font-size:15px; font-weight:bold; cursor:pointer; background:#27ae60; }
    .btn:hover { background:#229954; }
    .link { display:block; text-align:center; margin-top:14px; color:#3498db; text-decoration:none; font-size:14px; }
    .flash { padding:10px; border-radius:4px; margin-bottom:14px; font-size:13px; }
    .flash.error { background:#fdecea; color:#e74c3c; }
    .flash.success { background:#eafaf1; color:#27ae60; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">📝</div>
    <h1>Create Account</h1>
    <p class="sub">New user registration</p>
    <div class="card">
      <h2>📝 Register</h2>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="flash {{ cat }}">{{ msg }}</div>
        {% endfor %}
      {% endwith %}
      <form method="POST">
        <label>Username</label>
        <input type="text" name="username" required autofocus>
        <label>Password</label>
        <input type="password" name="password" required>
        <label>Confirm Password</label>
        <input type="password" name="password2" required>
        <button class="btn" type="submit">✅ Create Account</button>
      </form>
      <a class="link" href="{{ url_for('login') }}">🔙 Back to Login</a>
    </div>
  </div>
</body>
</html>
