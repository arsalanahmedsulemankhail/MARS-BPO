<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔐 CallsViewer - Login</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Sora:wght@700&display=swap');

    :root {
      --bg: #1a2233;
      --card: #ffffff;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --error-bg: #fef2f2;
      --error-text: #dc2626;
      --success-bg: #f0fdf4;
      --success-text: #16a34a;
      --input-focus: #3b82f6;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(59,130,246,0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(139,92,246,0.08) 0%, transparent 50%);
    }

    .container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
      text-align: center;
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo-wrap { margin-bottom: 20px; }

    .logo-icon {
      font-size: 42px;
      display: inline-block;
      animation: pop 0.4s 0.2s ease both;
    }

    @keyframes pop {
      from { transform: scale(0.7); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    h1 {
      font-family: 'Sora', sans-serif;
      font-size: 26px;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .sub {
      color: #94a3b8;
      font-size: 13px;
      margin-top: 4px;
      margin-bottom: 24px;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 32px;
      text-align: left;
      box-shadow: 0 25px 60px rgba(0,0,0,0.35);
    }

    .card-title {
      font-family: 'Sora', sans-serif;
      font-size: 18px;
      color: var(--text-dark);
      margin-bottom: 22px;
    }

    .flash {
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
      font-weight: 500;
    }

    .flash.error   { background: var(--error-bg);   color: var(--error-text); }
    .flash.success { background: var(--success-bg); color: var(--success-text); }

    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    input[type=text],
    input[type=password] {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      color: var(--text-dark);
      background: #f8fafc;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      outline: none;
    }

    input[type=text]:focus,
    input[type=password]:focus {
      border-color: var(--input-focus);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
    }

    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 44px; }

    .pw-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .pw-toggle:hover { color: var(--accent); }
    .pw-toggle svg { width: 18px; height: 18px; display: block; }

    .pw-hint {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 5px;
      user-select: none;
    }

    .pw-hint span {
      color: var(--accent);
      cursor: pointer;
      font-weight: 500;
    }

    .pw-hint span:hover { text-decoration: underline; }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      letter-spacing: 0.2px;
      margin-top: 4px;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(59,130,246,0.35);
    }

    .btn:hover  { background: var(--accent-hover); box-shadow: 0 6px 18px rgba(59,130,246,0.4); }
    .btn:active { transform: scale(0.98); }

    .link {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: var(--accent);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      transition: color 0.2s;
    }

    .link:hover { color: var(--accent-hover); text-decoration: underline; }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-wrap">
      <span class="logo-icon">📊</span>
      <h1>Calls Viewer</h1>
      <p class="sub">Web Application</p>
    </div>

    <div class="card">
      <div class="card-title">🔐 Login</div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="flash {{ cat }}">{{ msg }}</div>
        {% endfor %}
      {% endwith %}

      <form method="POST">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autofocus placeholder="Enter your username">
        </div>

        <div class="form-group">
          <label for="pw">Password</label>
          <div class="pw-wrap">
            <input type="password" id="pw" name="password" required placeholder="Enter your password">
            <button type="button" class="pw-toggle" onclick="togglePassword()" title="Show / Hide password" aria-label="Toggle password visibility">
              <!-- Eye icon (password hidden) -->
              <svg id="iconShow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <!-- Eye-off icon (password visible) -->
              <svg id="iconHide" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                   style="display:none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <p class="pw-hint" id="pwHint">
            Password is hidden — <span onclick="togglePassword()">Show</span>
          </p>
        </div>

        <button class="btn" type="submit">🔓 Login</button>
      </form>

      <div class="divider"></div>
      <a class="link" href="{{ url_for('register') }}">📝 Create New Account</a>
    </div>
  </div>

  <script>
    function togglePassword() {
      const input    = document.getElementById('pw');
      const iconShow = document.getElementById('iconShow');
      const iconHide = document.getElementById('iconHide');
      const hint     = document.getElementById('pwHint');

      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';

      iconShow.style.display = isHidden ? 'none'  : 'block';
      iconHide.style.display = isHidden ? 'block' : 'none';

      hint.innerHTML = isHidden
        ? 'Password is visible — <span onclick="togglePassword()">Hide</span>'
        : 'Password is hidden — <span onclick="togglePassword()">Show</span>';
    }
  </script>
</body>
</html>
